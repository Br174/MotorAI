name: Scudo360 r40 MotorAI native quality LAB
on:
  pull_request:
    branches:
      - motorlab/active-motorai-control
permissions:
  contents: read
  actions: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute existing r39 suite only once
        run: node .motorlab/regression/scudo360-gate.mjs .motorlab/scudo360-contracts.json lab .motorlab/scudo360-r40-native.json
      - name: Show exact native failure diagnostics if any
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const p='.motorlab/scudo360-r40-native.json';
          if(existsSync(p))for(const x of JSON.parse(readFileSync(p,'utf8')).suites||[])
            if(x.status!=='passed')console.log('SCUDO_R40_NATIVE_DIAGNOSTICS',x.logTail||x.error);
          NODE
      - name: Verify permanent exact historical JUnit baseline and workflow wiring
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const plan=read('.motorlab/scudo360-r40-plan.json');
          const baseline=read(plan.baselineReportPath);
          if(baseline.commit!==plan.baselineCommit||baseline.passed!==true||
             !baseline.provenance?.runId||!baseline.provenance?.artifactId)
            throw Error('SCUDO_R40_BASELINE_PROOF_MISSING_OR_MISMATCHED');
          for(const file of [".github/workflows/build-android-debug.yml",".github/workflows/scudo360-native-pr.yml"]) {
            const y=readFileSync(file,'utf8');
            const start=y.indexOf('scudo360-gate.mjs');
            const quality=y.indexOf('scudo360-quality-r40.mjs',start+1);
            if(start<0||quality<start||!y.slice(start,quality).includes('scudo360-report.json'))
              throw Error('SCUDO_R40_NATIVE_WORKFLOW_BYPASS:'+file);
          }
          console.log('SCUDO_R40_NATIVE_WORKFLOWS_HISTORICAL_PROOF_AND_WIRING_VERIFIED');
          NODE
      - name: Audit every native P0 P1 request on exact source commit
        env:
          SCUDO360_R40_PROMOTION: '1'
        run: node .motorlab/regression/scudo360-quality-r40.mjs .motorlab/scudo360-contracts.json .motorlab/scudo360-r40-native.json .motorlab/scudo360-r40-plan.json .motorlab/scudo360-r40-quality.json
      - name: Publish evidence including failed native contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scudo-r40-motorai-evidence
          path: |
            .motorlab/scudo360-r40-native.json
            .motorlab/scudo360-r40-quality.json
          if-no-files-found: warn
