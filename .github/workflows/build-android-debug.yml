name: MotorAI Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "lab/**"]
    paths:
      - "android/**"
      - "tools/**"
      - ".github/workflows/build-android-debug.yml"

permissions:
  contents: read

concurrency:
  group: motorai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify all ten Goal10 integration checks after full training and checkpoint reload
        id: goal10_integration_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal10_integrated_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal10_integrated
          /tmp/motorai_goal10_integrated

      - name: Verify Goal3 regression recovery without bypassing tests
        id: goal3_recovery_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal3_recovery_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal3_recovery_smoke
          /tmp/motorai_goal3_recovery_smoke

      - name: Verify native curriculum
        id: native_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/native_curriculum_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_curriculum_smoke
          /tmp/motorai_curriculum_smoke

      - name: Verify Mini-AI Goal1 native benchmark
        id: goal1_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal1_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal1_smoke
          /tmp/motorai_goal1_smoke

      - name: Verify Mini-AI Goal2 native benchmark
        id: goal2_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal2_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal2_smoke
          /tmp/motorai_goal2_smoke

      - name: Verify Mini-AI Goal3 memory benchmark
        id: goal3_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal3_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal3_smoke
          /tmp/motorai_goal3_smoke

      - name: Verify Mini-AI Goal4 reasoning benchmark
        id: goal4_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal4_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal4_smoke
          /tmp/motorai_goal4_smoke

      - name: Verify Mini-AI Goal5 uncertainty benchmark
        id: goal5_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal5_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal5_smoke
          /tmp/motorai_goal5_smoke

      - name: Verify Mini-AI Goal6 search benchmark
        id: goal6_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal6_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal6_smoke
          /tmp/motorai_goal6_smoke

      - name: Verify Mini-AI Goal7 tool-router benchmark
        id: goal7_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal7_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal7_smoke
          /tmp/motorai_goal7_smoke

      - name: Verify Mini-AI Goal8 planning benchmark
        id: goal8_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal8_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal8_smoke
          /tmp/motorai_goal8_smoke

      - name: Verify Mini-AI Goal9 self-check benchmark
        id: goal9_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal9_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal9_smoke
          /tmp/motorai_goal9_smoke

      - name: Verify Mini-AI Goal10 assistant-cycle benchmark
        id: goal10_gate
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            tools/goal10_smoke.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_goal10_smoke
          /tmp/motorai_goal10_smoke

      - name: Verify background Auto-Training handoff
        run: |
          grep -q "scheduleKick" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "setMinimumLatency" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "MAX_CHUNKS_PER_WAKE" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "if (!runLevel5Chunk(runtime, evo))" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "MotorAIBackgroundJobService.scheduleKick" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "startHeartbeat" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "RANGE_HOUR_MS" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "EvolutionHistory.record" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "setTimeAxis" android/app/src/main/java/it/motorai/seed/EvolutionView.java
          grep -q "Cosa sta facendo adesso" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "Apri i 10 obiettivi" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "class MiniAiGoalsActivity" android/app/src/main/java/it/motorai/seed/MiniAiGoalsActivity.java
          grep -q "totalPercent" android/app/src/main/java/it/motorai/seed/MiniAiGoals.java
          grep -q "MiniAiGoalsActivity" android/app/src/main/AndroidManifest.xml
          grep -q "nativeGoal1TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal1Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "miniAiGoal1Percent" android/app/src/main/java/it/motorai/seed/MotorAIBridgeClient.java
          grep -q "nativeGoal2TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal2Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "class ChatActivity" android/app/src/main/java/it/motorai/seed/ChatActivity.java
          grep -q "class TrainingActivity" android/app/src/main/java/it/motorai/seed/TrainingActivity.java
          grep -q "class MiniAiTrainingCoordinator" android/app/src/main/java/it/motorai/seed/MiniAiTrainingCoordinator.java
          grep -q "ChatActivity" android/app/src/main/AndroidManifest.xml
          grep -q "TrainingActivity" android/app/src/main/AndroidManifest.xml
          grep -q "nativeGoal3TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal3Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "class ConversationMemory" android/app/src/main/java/it/motorai/seed/ConversationMemory.java
          grep -q "nativeGoal4TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal4Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "nativeGoal4Solve" android/app/src/main/java/it/motorai/seed/ChatActivity.java
          grep -q "nativeGoal5TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal5Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "nativeGoal5Classify" android/app/src/main/java/it/motorai/seed/ChatActivity.java
          grep -q "nativeGoal6TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal6Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "class MiniAiWebSearch" android/app/src/main/java/it/motorai/seed/MiniAiWebSearch.java
          grep -q "nativeGoal6Plan" android/app/src/main/java/it/motorai/seed/ChatActivity.java
          grep -q "nativeGoal7TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal7Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "class MiniAiCalculator" android/app/src/main/java/it/motorai/seed/MiniAiCalculator.java
          grep -q "nativeGoal7Route" android/app/src/main/java/it/motorai/seed/ChatActivity.java
          grep -q "nativeGoal8TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal8Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "nativeGoal8Plan" android/app/src/main/java/it/motorai/seed/ChatActivity.java
          grep -q "nativeGoal9TrainChunk" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal9Chunk" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java
          grep -q "nativeGoal9Review" android/app/src/main/java/it/motorai/seed/ChatActivity.java
          grep -q "selfCheckAndCorrect" android/app/src/main/java/it/motorai/seed/ChatActivity.java
          grep -q "class MiniAiAssistantCycle" android/app/src/main/java/it/motorai/seed/MiniAiAssistantCycle.java
          grep -q "runMiniAiGoal10Certification" android/app/src/main/java/it/motorai/seed/MainActivity.java
          grep -q "runGoal10Certification" android/app/src/main/java/it/motorai/seed/MotorAIBackgroundJobService.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Restore stable MotorAI LAB signing key
        run: base64 -d .github/lab-signing/motorai-lab.keystore.b64 > android/app/motorai-lab.keystore

      - name: Build MotorAI debug APK
        id: android_build
        continue-on-error: true
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload MotorAI APK
        if: steps.native_gate.outcome == 'success' && steps.goal1_gate.outcome == 'success' && steps.goal2_gate.outcome == 'success' && steps.goal3_gate.outcome == 'success' && steps.goal3_recovery_gate.outcome == 'success' && steps.goal4_gate.outcome == 'success' && steps.goal5_gate.outcome == 'success' && steps.goal6_gate.outcome == 'success' && steps.goal7_gate.outcome == 'success' && steps.goal8_gate.outcome == 'success' && steps.goal9_gate.outcome == 'success' && steps.goal10_gate.outcome == 'success' && steps.goal10_integration_gate.outcome == 'success' && steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: MotorAI-Seed021R2-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Final combined gate
        if: always()
        run: |
          echo "Native curriculum: ${{ steps.native_gate.outcome }}"
          echo "Mini-AI Goal1: ${{ steps.goal1_gate.outcome }}"
          echo "Mini-AI Goal2: ${{ steps.goal2_gate.outcome }}"
          echo "Mini-AI Goal3: ${{ steps.goal3_gate.outcome }}"
          echo "Goal3 recovery gate: ${{ steps.goal3_recovery_gate.outcome }}"
          echo "Mini-AI Goal4: ${{ steps.goal4_gate.outcome }}"
          echo "Mini-AI Goal5: ${{ steps.goal5_gate.outcome }}"
          echo "Mini-AI Goal6: ${{ steps.goal6_gate.outcome }}"
          echo "Mini-AI Goal7: ${{ steps.goal7_gate.outcome }}"
          echo "Mini-AI Goal8: ${{ steps.goal8_gate.outcome }}"
          echo "Mini-AI Goal9: ${{ steps.goal9_gate.outcome }}"
          echo "Mini-AI Goal10: ${{ steps.goal10_gate.outcome }}"
          echo "Goal10 integration: ${{ steps.goal10_integration_gate.outcome }}"
          echo "Android build: ${{ steps.android_build.outcome }}"
          test "${{ steps.native_gate.outcome }}" = "success"
          test "${{ steps.goal1_gate.outcome }}" = "success"
          test "${{ steps.goal2_gate.outcome }}" = "success"
          test "${{ steps.goal3_gate.outcome }}" = "success"
          test "${{ steps.goal3_recovery_gate.outcome }}" = "success"
          test "${{ steps.goal4_gate.outcome }}" = "success"
          test "${{ steps.goal5_gate.outcome }}" = "success"
          test "${{ steps.goal6_gate.outcome }}" = "success"
          test "${{ steps.goal7_gate.outcome }}" = "success"
          test "${{ steps.goal8_gate.outcome }}" = "success"
          test "${{ steps.goal9_gate.outcome }}" = "success"
          test "${{ steps.goal10_gate.outcome }}" = "success"
          test "${{ steps.goal10_integration_gate.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"

