name: MotorAI Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "lab/**"]
    paths:
      - "android/**"
      - ".github/workflows/build-android-debug.yml"

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Restore stable MotorAI LAB signing key
        run: base64 -d .github/lab-signing/motorai-lab.keystore.b64 > android/app/motorai-lab.keystore

      - name: Build MotorAI debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload MotorAI APK
        uses: actions/upload-artifact@v6
        with:
          name: MotorAI-Seed004-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# Seed004 final validation trigger
