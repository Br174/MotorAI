name: MotorAI Scudo360 native curriculum PR gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/**'
      - 'tools/**'
      - '.motorlab/**'
      - '.github/workflows/build-android-debug.yml'
      - '.github/workflows/scudo360-native-pr.yml'
permissions:
  contents: read
jobs:
  curriculum:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Run real C++ native smoke with JUnit evidence
        run: node .motorlab/regression/scudo360-gate.mjs .motorlab/scudo360-contracts.json promotion .motorlab/scudo360-report.json
      - name: Scudo360 Quality r40 mandatory native C++ request evidence
        env:
          SCUDO360_R40_PROMOTION: '1'
        run: node .motorlab/regression/scudo360-quality-r40.mjs .motorlab/scudo360-contracts.json .motorlab/scudo360-report.json .motorlab/scudo360-r40-plan.json .motorlab/scudo360-r40-quality.json
      - name: Print native diagnosis if Scudo detected a regression
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path='.motorlab/scudo360-report.json';
          if(!fs.existsSync(path))process.exit(0);
          const r=JSON.parse(fs.readFileSync(path,'utf8'));
          if(!r.passed)for(const s of (r.suites||[]))console.log('SCUDO360_NATIVE_FAILURE',s.id,s.logTail||s.error||'unknown');
          NODE
      # Controlled A/B diagnosis. The required Scudo gate above remains fail-closed.
      # Compile the ORIGINAL unmodified main test against this branch's unchanged C++ engine.
      - name: Diagnose pristine baseline test with the same CI compiler
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "SCUDO_BASELINE_COMPILER=$(g++ --version | head -n 1)"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}" || exit 72
          git show FETCH_HEAD:tools/native_curriculum_smoke.cpp > /tmp/motorai_original_curriculum.cpp || exit 73
          g++ -std=c++20 -O2 -pthread -Iandroid/app/src/main/cpp \
            /tmp/motorai_original_curriculum.cpp android/app/src/main/cpp/motorai_core.cpp \
            -o /tmp/motorai_original_curriculum || exit 74
          set +e
          /tmp/motorai_original_curriculum
          result=$?
          set -e
          echo "SCUDO_PRISTINE_MAIN_SMOKE_EXIT=$result"
          exit "$result"
      - name: Attach native test receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scudo360-motorai-pr-${{ github.run_id }}
          path: |
            .motorlab/scudo360-report.json
            .motorlab/scudo360-test-results/*.xml
          if-no-files-found: warn
